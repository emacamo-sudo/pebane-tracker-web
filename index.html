<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pebane Phase 1 Action Tracker</title>
<style>
  :root{--orange:#F05423;--ink:#111;--line:#e5e5e5;--bg:#faf9f7;--muted:#6b7280}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  a{color:var(--orange)}
  .wrap{max-width:1300px;margin:0 auto;padding:16px 20px}
  nav{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:20px;flex-wrap:wrap;gap:10px}
  nav .brand{display:flex;align-items:center;gap:10px;font-weight:700}
  nav .logo{background:var(--orange);color:#fff;width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800}
  nav .links{display:flex;gap:14px;font-size:14px}
  nav .links a{color:var(--muted);text-decoration:none;cursor:pointer}
  nav .links a.active,nav .links a:hover{color:var(--orange)}
  .right{display:flex;align-items:center;gap:8px}
  button{font:inherit;cursor:pointer}
  .btn{background:var(--orange);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:600}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .chip{border:1px solid var(--line);border-radius:999px;background:#fff;padding:4px 8px;font-size:12px}
  .chip b{background:var(--orange);color:#fff;border-radius:999px;padding:3px 8px;margin:-4px 2px -4px -6px;display:inline-block}
  .tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0 26px}
  @media(max-width:760px){.tiles{grid-template-columns:repeat(2,1fr)}}
  .tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
  .tile .n{font-size:28px;font-weight:800}
  .tile .l{font-size:12px;color:var(--muted);margin-top:4px}
  .badge{border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600}
  .ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}
  table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;overflow:auto}
  th{background:#f3f4f6;text-align:left;padding:8px;color:#4b5563;font-size:12px;white-space:nowrap}
  td{border-top:1px solid #f1f1f1;padding:6px 8px;vertical-align:top}
  select,input,textarea{font:inherit;border:1px solid transparent;border-radius:6px;padding:4px 6px;background:#fff}
  td select:hover,td input:hover,td textarea:hover{border-color:var(--line)}
  td select:focus,td input:focus,td textarea:focus{border-color:var(--orange);outline:none}
  .tag{border-radius:6px;padding:2px 8px;font-size:11px;white-space:nowrap}
  .Red{background:#fee2e2;color:#991b1b}.Amber{background:#fef3c7;color:#92400e}.Green{background:#dcfce7;color:#166534}
  .OnHold{background:#e5e7eb;color:#374151}.Complete{background:#dbeafe;color:#1e40af}
  .Overdue{background:#fee2e2;color:#991b1b}.Due{background:#fef3c7;color:#92400e}.On{background:#f3f4f6;color:#6b7280}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .filters select,.filters input{border:1px solid var(--line)}
  .save{font-size:11px}.saving{color:#6b7280}.saved{color:#16a34a}.conflict{color:#dc2626}
  .center{min-height:80vh;display:flex;align-items:center;justify-content:center}
  .login{width:380px;max-width:92vw}
  .login .box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:14px}
  .login input{width:100%;border:1px solid var(--line);margin:6px 0 10px}
  .muted{color:var(--muted);font-size:13px}
  h1{font-size:20px;margin:0 0 12px}
  .hide{display:none}
  .trashrow td{color:#9ca3af}
  .matrix td,.matrix th{text-align:center;min-width:48px}
  .matrix td.rowh{text-align:left;white-space:nowrap;font-weight:600}
  .cell0{color:#cbd5e1}.cellN{font-weight:700}.cellO{color:#991b1b;font-weight:700}
  .gov h3{font-size:14px;margin:18px 0 8px;color:var(--orange)}
  .gov .b{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
  .lane{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:13px;padding:5px 0;border-top:1px solid #f1f1f1}
  .lane:first-child{border-top:none}.sec{margin-top:4px}
</style>
</head>
<body>
<div id="app" class="wrap"><div class="center muted">A carregar…</div></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://kciboyetjltpjbjmryml.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjaWJveWV0amx0cGpiam1yeW1sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4NDYyNTMsImV4cCI6MjExMDQyMjI1M30.Tx7dhdgrOgADGUgLP7qAj6mJoQVdxa1BCrVC74iMcpc';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

const T = {
  pt:{title:'Pebane Fase 1 — Registo de Acções',dashboard:'Painel',components:'Componentes',actions:'Acções',
    signin:'Entrar',email:'Endereço de email',send:'Enviar link de acesso',check:'Verifique o seu email — enviámos um link de acesso.',
    signout:'Sair',total:'Total de acções',open:'Em aberto',overdue:'Em atraso',due:'A vencer (7 dias)',red:'Componentes a vermelho',
    verify:'Verificação §7',vok:'Contagens validadas',vbad:'Divergência',comp:'Componente',avg:'% Médio',rag:'RAG',
    all:'Todos',resp:'Responsável',status:'Estado',gate:'Gate',flag:'Sinal',search:'Pesquisar…',add:'Nova acção',
    deliverable:'Acção / Entregável',prio:'Prioridade',duecol:'Prazo',pct:'% Concl.',owner:'Dono',target:'Conclusão alvo',
    milestone:'Próximo marco',trash:'Lixo',restore:'Restaurar',del:'Apagar',conflict:'Alterado noutra sessão — recarregue',
    navMatrix:'Matriz',navMeeting:'Reunião',navPerson:'Por responsável',navWeekly:'Semanal',navGov:'Governança',
    mtxTitle:'Matriz (Componente × Gate)',meetTitle:'Reunião de projecto',persTitle:'Seguimento por responsável',wkTitle:'Relatório semanal',
    govTitle:'Governança e Responsabilidades',govParties:'Partes',govBodies:'Órgãos',govWs:'Workstreams (WS1–WS6)',govExt:'Interfaces externas',govFuture:'SPVs (futuro)',
    lead:'Lead',colead:'Co-lead',joint:'Conjuntas',dueWeek:'A vencer / em atraso',recent:'Actualizados (7 dias)',openItems:'em aberto',none:'—',yes:'Sim',no:'Não',lang:'EN'},
  en:{title:'Pebane Phase 1 Action Tracker',dashboard:'Dashboard',components:'Components',actions:'Actions',
    signin:'Sign in',email:'Email address',send:'Send magic link',check:'Check your email — we sent a sign-in link.',
    signout:'Sign out',total:'Total actions',open:'Open',overdue:'Overdue',due:'Due (7 days)',red:'Red components',
    verify:'§7 verification',vok:'Counts validated',vbad:'Mismatch',comp:'Component',avg:'Avg %',rag:'RAG',
    all:'All',resp:'Responsible',status:'Status',gate:'Gate',flag:'Flag',search:'Search…',add:'New action',
    deliverable:'Action / Deliverable',prio:'Priority',duecol:'Due',pct:'% Compl.',owner:'Owner',target:'Target completion',
    milestone:'Next milestone',trash:'Trash',restore:'Restore',del:'Delete',conflict:'Changed in another session — reload',
    navMatrix:'Matrix',navMeeting:'Meeting',navPerson:'By person',navWeekly:'Weekly',navGov:'Governance',
    mtxTitle:'Matrix (Component × Gate)',meetTitle:'Project meeting',persTitle:'Person follow-up',wkTitle:'Weekly report',
    govTitle:'Governance & Responsibilities',govParties:'Parties',govBodies:'Bodies',govWs:'Workstreams (WS1–WS6)',govExt:'External interfaces',govFuture:'SPVs (future)',
    lead:'Lead',colead:'Co-lead',joint:'Joint',dueWeek:'Due / overdue',recent:'Updated (7 days)',openItems:'open',none:'—',yes:'Yes',no:'No',lang:'PT'}
};
let lang = localStorage.getItem('lang')==='en'?'en':'pt';
const t = k => T[lang][k];
const app = document.getElementById('app');
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt = d => { if(!d) return ''; const [y,m,dd]=d.split('-'); return `${+dd} ${MON[+m-1]} ${y}`; };
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const flagClass = f => f==='Overdue'?'Overdue':f==='Due 7 days'?'Due':'On';
const ragClass = r => ({Red:'Red',Amber:'Amber',Green:'Green','On Hold':'OnHold',Complete:'Complete'}[r]||'On');
let lists={}, people=[], view='dashboard';

async function loadLists(){
  const {data}=await sb.from('lists').select('category,value,position').order('position');
  lists={}; (data||[]).forEach(r=>{(lists[r.category]=lists[r.category]||[]).push(r.value)});
}
function opt(cat,val){return (lists[cat]||[]).map(v=>`<option${v===val?' selected':''}>${esc(v)}</option>`).join('')}

function shell(inner){
  return `<nav>
    <div class="brand"><span class="logo">M</span><div><div style="color:var(--orange);font-size:11px;letter-spacing:.08em">MOZSA</div><div style="font-size:14px">${t('title')}</div></div></div>
    <div class="right">
      <div class="links">
        <a data-nav="dashboard" class="${view==='dashboard'?'active':''}">${t('dashboard')}</a>
        <a data-nav="components" class="${view==='components'?'active':''}">${t('components')}</a>
        <a data-nav="actions" class="${view==='actions'?'active':''}">${t('actions')}</a>
        <a data-nav="matrix" class="${view==='matrix'?'active':''}">${t('navMatrix')}</a>
        <a data-nav="meeting" class="${view==='meeting'?'active':''}">${t('navMeeting')}</a>
        <a data-nav="person" class="${view==='person'?'active':''}">${t('navPerson')}</a>
        <a data-nav="weekly" class="${view==='weekly'?'active':''}">${t('navWeekly')}</a>
        <a data-nav="governance" class="${view==='governance'?'active':''}">${t('navGov')}</a>
      </div>
      <button class="chip" id="lang">${t('lang')}</button>
      <button class="btn ghost" id="signout">${t('signout')}</button>
    </div></nav>${inner}`;
}
function wireShell(){
  document.querySelectorAll('[data-nav]').forEach(a=>a.onclick=()=>{view=a.dataset.nav;render()});
  document.getElementById('lang').onclick=()=>{lang=lang==='pt'?'en':'pt';localStorage.setItem('lang',lang);render()};
  document.getElementById('signout').onclick=async()=>{await sb.auth.signOut();render()};
}

async function dashboard(){
  const [{data:d},{data:cm}]=await Promise.all([
    sb.from('v_dashboard').select('*').maybeSingle(),
    sb.from('v_component_metrics').select('*').order('component_id')
  ]);
  const dd=d||{total:0,open:0,overdue:0,due_next_7_days:0,red_components:0};
  const comps=cm||[];
  const ok = dd.total===78 && comps.length===8;
  const tiles=[['total',dd.total],['open',dd.open],['overdue',dd.overdue],['due',dd.due_next_7_days],['red',dd.red_components]];
  app.innerHTML=shell(`
    <div style="display:flex;justify-content:space-between;align-items:center"><h1>${t('dashboard')}</h1>
      <span class="badge ${ok?'ok':'bad'}">${t('verify')}: ${ok?t('vok'):t('vbad')}</span></div>
    <div class="tiles">${tiles.map(([k,v])=>`<div class="tile"><div class="n">${v??0}</div><div class="l">${t(k)}</div></div>`).join('')}</div>
    <div class="card"><table><thead><tr><th>ID</th><th>${t('comp')}</th><th>Total</th><th>${t('open')}</th><th>${t('overdue')}</th><th>${t('avg')}</th><th>${t('rag')}</th></tr></thead>
    <tbody>${comps.map(c=>`<tr><td><b>${c.component_id}</b></td><td>${esc(c.name)}</td><td>${c.total_actions}</td><td>${c.open_actions}</td><td>${c.overdue}</td><td>${c.avg_pct_complete??0}%</td><td><span class="tag ${ragClass(c.rag)}">${c.rag}</span></td></tr>`).join('')}</tbody></table></div>`);
  wireShell();
}

async function componentsView(){
  const {data}=await sb.from('components').select('*').order('component_id');
  const rows=data||[];
  const row=c=>`<tr data-id="${c.component_id}"><td><b>${c.component_id}</b></td><td>${esc(c.name)}</td>
    <td><select data-f="owner"><option></option>${opt('people',c.owner)}</select></td>
    <td><select data-f="priority"><option></option>${opt('priority',c.priority)}</select></td>
    <td><select data-f="status"><option></option>${opt('project_status',c.status)}</select></td>
    <td><input type="date" data-f="target_completion" value="${c.target_completion||''}"></td>
    <td><input data-f="next_milestone" value="${esc(c.next_milestone)}" style="width:220px"></td>
    <td class="save"></td></tr>`;
  app.innerHTML=shell(`<h1>${t('components')}</h1><div class="card"><table><thead><tr><th>ID</th><th>${t('comp')}</th><th>${t('owner')}</th><th>${t('prio')}</th><th>${t('status')}</th><th>${t('target')}</th><th>${t('milestone')}</th><th></th></tr></thead><tbody>${rows.map(row).join('')}</tbody></table></div>`);
  wireShell();
  app.querySelectorAll('tbody tr').forEach(tr=>{
    const id=tr.dataset.id, cur=rows.find(r=>r.component_id===id);
    tr.querySelectorAll('[data-f]').forEach(el=>el.addEventListener('change',()=>saveRow('components','component_id',id,cur,el.dataset.f,el.value,tr)));
  });
}

async function actionsView(){
  const [{data:live},{data:del}]=await Promise.all([
    sb.from('v_actions').select('*').order('action_id'),
    sb.from('actions').select('action_id,action_deliverable,component_id').not('deleted_at','is',null).order('action_id')
  ]);
  let rows=live||[]; const trash=del||[];
  const peopleOpts=lists.people||[], gateOpts=lists.gate||[], statusOpts=lists.action_status||[];
  const compIds=[...new Set(rows.map(r=>r.component_id))].sort();
  const F={comp:'',gate:'',resp:'',status:'',flag:'',q:''};
  const render2=()=>{
    const f=rows.filter(r=>(!F.comp||r.component_id===F.comp)&&(!F.gate||r.gate===F.gate)&&(!F.resp||r.responsible===F.resp)&&(!F.status||r.status===F.status)&&(!F.flag||r.flag===F.flag)&&(!F.q||((r.action_deliverable||'')+' '+r.action_id).toLowerCase().includes(F.q.toLowerCase())));
    const body=f.map(r=>`<tr data-id="${r.action_id}">
      <td><b>${r.action_id}</b></td>
      <td><textarea data-f="action_deliverable" rows="1" style="width:260px">${esc(r.action_deliverable)}</textarea></td>
      <td><select data-f="gate"><option></option>${opt('gate',r.gate)}</select></td>
      <td><select data-f="responsible"><option></option>${opt('people',r.responsible)}</select></td>
      <td><select data-f="status"><option></option>${opt('action_status',r.status)}</select></td>
      <td><select data-f="priority"><option></option>${opt('priority',r.priority)}</select></td>
      <td><input type="date" data-f="due_date" value="${r.due_date||''}"></td>
      <td><input type="number" min="0" max="100" data-f="pct_complete" value="${r.pct_complete??0}" style="width:60px"></td>
      <td>${r.flag?`<span class="tag ${flagClass(r.flag)}">${r.flag}</span>`:''}</td>
      <td class="save"></td><td><button class="chip" data-del="${r.action_id}">🗑</button></td></tr>`).join('');
    document.getElementById('tbody').innerHTML=body;
    f.forEach(r=>{
      const tr=document.querySelector(`tr[data-id="${r.action_id}"]`);
      tr.querySelectorAll('[data-f]').forEach(el=>{
        const ev=el.tagName==='TEXTAREA'||el.type==='number'?'blur':'change';
        el.addEventListener(ev,()=>saveRow('actions','action_id',r.action_id,r,el.dataset.f,el.type==='number'?(+el.value||0):el.value,tr));
      });
      tr.querySelector('[data-del]').onclick=async()=>{await sb.from('actions').update({deleted_at:new Date().toISOString()}).eq('action_id',r.action_id);actionsView()};
    });
  };
  app.innerHTML=shell(`<div style="display:flex;justify-content:space-between;align-items:center"><h1>${t('actions')}</h1>
    <button class="btn" id="addbtn">+ ${t('add')}</button></div>
    <div class="filters">
      <input id="q" placeholder="${t('search')}">
      <select id="fcomp"><option value="">${t('comp')}: ${t('all')}</option>${compIds.map(c=>`<option>${c}</option>`).join('')}</select>
      <select id="fgate"><option value="">${t('gate')}: ${t('all')}</option>${gateOpts.map(g=>`<option>${esc(g)}</option>`).join('')}</select>
      <select id="fresp"><option value="">${t('resp')}: ${t('all')}</option>${peopleOpts.map(p=>`<option>${esc(p)}</option>`).join('')}</select>
      <select id="fstatus"><option value="">${t('status')}: ${t('all')}</option>${statusOpts.map(s=>`<option>${esc(s)}</option>`).join('')}</select>
      <select id="fflag"><option value="">${t('flag')}: ${t('all')}</option>${['Overdue','Due 7 days','On track','Complete'].map(x=>`<option>${x}</option>`).join('')}</select>
      <span class="chip">${t('trash')}: ${trash.length}</span>
    </div>
    <div class="card"><table><thead><tr><th>ID</th><th>${t('deliverable')}</th><th>${t('gate')}</th><th>${t('resp')}</th><th>${t('status')}</th><th>${t('prio')}</th><th>${t('duecol')}</th><th>${t('pct')}</th><th>${t('flag')}</th><th></th><th></th></tr></thead><tbody id="tbody"></tbody></table></div>
    ${trash.length?`<div class="card" style="margin-top:14px"><table><tbody>${trash.map(r=>`<tr class="trashrow"><td><b>${r.action_id}</b></td><td>${esc(r.action_deliverable)}</td><td><button class="chip" data-restore="${r.action_id}">↩ ${t('restore')}</button></td></tr>`).join('')}</tbody></table></div>`:''}`);
  wireShell();
  render2();
  document.getElementById('q').oninput=e=>{F.q=e.target.value;render2()};
  document.getElementById('fcomp').onchange=e=>{F.comp=e.target.value;render2()};
  document.getElementById('fgate').onchange=e=>{F.gate=e.target.value;render2()};
  document.getElementById('fresp').onchange=e=>{F.resp=e.target.value;render2()};
  document.getElementById('fstatus').onchange=e=>{F.status=e.target.value;render2()};
  document.getElementById('fflag').onchange=e=>{F.flag=e.target.value;render2()};
  document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=async()=>{await sb.from('actions').update({deleted_at:null}).eq('action_id',b.dataset.restore);actionsView()});
  document.getElementById('addbtn').onclick=async()=>{
    const {data:last}=await sb.from('actions').select('action_id').order('action_id',{ascending:false}).limit(1).maybeSingle();
    const n=last?parseInt(last.action_id.replace(/\D/g,''))+1:1, id='A'+String(n).padStart(3,'0');
    const comp=F.comp||compIds[0];
    await sb.from('actions').insert({action_id:id,component_id:comp,status:'Not Started',pct_complete:0,priority:'Medium',date_raised:new Date().toISOString().slice(0,10),action_deliverable:''});
    actionsView();
  };
}

async function saveRow(table,key,id,cur,field,value,tr){
  const cell=tr.querySelector('.save'); if(cell){cell.innerHTML=`<span class="saving">…</span>`}
  const patch={}; patch[field]=value===''?null:value;
  const {data,error}=await sb.from(table).update(patch).eq(key,id).eq('version',cur.version).select('version').maybeSingle();
  if(error){cell.innerHTML=`<span class="conflict">!</span>`;return}
  if(!data){cell.innerHTML=`<span class="conflict" title="${t('conflict')}">⚠︎</span>`;return}
  cur.version=data.version; cur[field]=patch[field];
  if(cell){cell.innerHTML=`<span class="saved">✓</span>`;setTimeout(()=>cell.innerHTML='',1400)}
}

function loginView(){
  app.innerHTML=`<div class="center"><div class="login">
    <nav style="border:none;padding:0"><div class="brand"><span class="logo">M</span><div><div style="color:var(--orange);font-size:11px;letter-spacing:.08em">MOZSA</div><div style="font-size:14px">${t('title')}</div></div></div><button class="chip" id="lang">${t('lang')}</button></nav>
    <div class="box"><h1>${t('signin')}</h1><div id="msg"></div>
    <label class="muted">${t('email')}</label><input id="email" type="email" placeholder="${t('email')}">
    <button class="btn" id="send" style="width:100%">${t('send')}</button></div></div></div>`;
  document.getElementById('lang').onclick=()=>{lang=lang==='pt'?'en':'pt';localStorage.setItem('lang',lang);loginView()};
  document.getElementById('send').onclick=async()=>{
    const email=document.getElementById('email').value.trim(); if(!email)return;
    const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
    document.getElementById('msg').innerHTML=error?`<p class="conflict">${esc(error.message)}</p>`:`<p style="color:#166534">${t('check')}</p>`;
  };
}

async function matrixView(){
  const {data}=await sb.from('v_actions').select('component_id,gate,flag');
  const rows=data||[]; const gates=lists.gate||[];
  const comps=[...new Set(rows.map(r=>r.component_id))].sort();
  const cell=(c,g)=>{const a=rows.filter(r=>r.component_id===c&&r.gate===g);const o=a.filter(r=>r.flag==='Overdue').length;return a.length?`<span class="${o?'cellO':'cellN'}">${a.length}${o?` (${o}!)`:''}</span>`:'<span class="cell0">·</span>'};
  app.innerHTML=shell(`<h1>${t('mtxTitle')}</h1>
   <div class="card"><table class="matrix"><thead><tr><th>${t('comp')}</th>${gates.map(g=>`<th title="${esc(g)}">${g.split(' ')[0]}</th>`).join('')}<th>Σ</th></tr></thead>
   <tbody>${comps.map(c=>`<tr><td class="rowh">${c}</td>${gates.map(g=>`<td>${cell(c,g)}</td>`).join('')}<td class="cellN">${rows.filter(r=>r.component_id===c).length}</td></tr>`).join('')}
   <tr><td class="rowh">Σ</td>${gates.map(g=>`<td class="cellN">${rows.filter(r=>r.gate===g).length}</td>`).join('')}<td class="cellN">${rows.length}</td></tr></tbody></table></div>
   <p class="muted" style="margin-top:8px">${t('overdue')}: (n!) · Gate G1–G6</p>`);
  wireShell();
}
const _rowsTable=a=>`<table><tbody>${a.map(r=>`<tr><td>${r.action_id}</td><td>${r.component_id}</td><td>${esc(r.action_deliverable)}</td><td>${esc(r.responsible)||''}</td><td>${esc(r.status)||''}</td><td>${r.due_date?fmt(r.due_date):''}</td><td>${r.flag?`<span class="tag ${flagClass(r.flag)}">${r.flag}</span>`:''}</td></tr>`).join('')}</tbody></table>`;
const _ord={Overdue:0,'Due 7 days':1,'On track':2,Complete:3};
async function meetingView(){
  const [{data:av},{data:cmp}]=await Promise.all([sb.from('v_actions').select('*').order('component_id'),sb.from('components').select('component_id,name,next_milestone,milestone_due').order('component_id')]);
  const rows=av||[],comps=cmp||[];
  const secs=comps.map(c=>{const a=(rows.filter(r=>r.component_id===c.component_id&&r.status!=='Complete')).sort((x,y)=>_ord[x.flag]-_ord[y.flag]);if(!a.length)return '';
    return `<div class="b"><div style="font-weight:700">${c.component_id} — ${esc(c.name)}</div><div class="muted sec">${t('milestone')}: ${esc(c.next_milestone)||'—'}${c.milestone_due?' · '+fmt(c.milestone_due):''}</div>${_rowsTable(a)}</div>`;}).join('');
  app.innerHTML=shell(`<h1>${t('meetTitle')}</h1><div class="gov">${secs||t('none')}</div>`); wireShell();
}
async function personView(){
  const {data}=await sb.from('v_actions').select('*');
  const rows=(data||[]).filter(r=>r.status!=='Complete'); const byP={};
  rows.forEach(r=>{const k=r.responsible||'—';(byP[k]=byP[k]||[]).push(r)});
  const secs=Object.keys(byP).sort().map(k=>{const a=byP[k].sort((x,y)=>_ord[x.flag]-_ord[y.flag]);const ov=a.filter(r=>r.flag==='Overdue').length;
    return `<div class="b"><div style="font-weight:700">${esc(k)} <span class="muted">· ${a.length} ${t('openItems')}${ov?` · ${ov} ${t('overdue')}`:''}</span></div>${_rowsTable(a)}</div>`;}).join('');
  app.innerHTML=shell(`<h1>${t('persTitle')}</h1><div class="gov">${secs||t('none')}</div>`); wireShell();
}
async function weeklyView(){
  const [{data:d},{data:av}]=await Promise.all([sb.from('v_dashboard').select('*').maybeSingle(),sb.from('v_actions').select('*')]);
  const dd=d||{},rows=av||[];
  const dueWeek=rows.filter(r=>r.flag==='Overdue'||r.flag==='Due 7 days').sort((a,b)=>(a.due_date||'').localeCompare(b.due_date||''));
  const wk=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  const recent=rows.filter(r=>r.last_updated&&r.last_updated>=wk).sort((a,b)=>(b.last_updated||'').localeCompare(a.last_updated||''));
  const tiles=[['total',dd.total],['open',dd.open],['overdue',dd.overdue],['due',dd.due_next_7_days],['red',dd.red_components]];
  app.innerHTML=shell(`<h1>${t('wkTitle')}</h1>
   <div class="tiles">${tiles.map(([k,v])=>`<div class="tile"><div class="n">${v??0}</div><div class="l">${t(k)}</div></div>`).join('')}</div>
   <div class="gov"><h3>${t('dueWeek')}</h3><div class="b">${dueWeek.length?_rowsTable(dueWeek):t('none')}</div>
   <h3>${t('recent')}</h3><div class="b">${recent.length?_rowsTable(recent):t('none')}</div></div>`); wireShell();
}
async function governanceView(){
  const [o,b,w,e,s]=await Promise.all([sb.from('organisations').select('*'),sb.from('bodies').select('*'),sb.from('governance_workstreams').select('*').order('ws'),sb.from('external_interfaces').select('*'),sb.from('spvs_future').select('*')]);
  const orgs=o.data||[],bodies=b.data||[],ws=w.data||[],ext=e.data||[],spv=s.data||[];
  app.innerHTML=shell(`<h1>${t('govTitle')}</h1><div class="gov">
   <h3>${t('govParties')}</h3><div class="b">${orgs.map(x=>`<div class="lane"><div>${esc(x.name)}</div><div><b>${x.share_pct!=null?x.share_pct+'%':''}</b> ${esc(x.role)||''}</div></div>`).join('')||t('none')}</div>
   <h3>${t('govBodies')}</h3>${bodies.map(x=>`<div class="b"><div style="font-weight:700">${esc(x.body)}</div><div class="muted sec">${esc(x.composition)||''}</div><div class="sec">${esc(x.cadence)||''}</div><div class="sec">${esc(x.scope)||''}</div></div>`).join('')||t('none')}
   <h3>${t('govWs')}</h3><div class="card"><table><thead><tr><th>WS</th><th>${t('comp')}</th><th>${t('lead')}</th><th>${t('colead')}</th><th>${t('joint')}</th></tr></thead><tbody>${ws.map(x=>`<tr><td><b>${x.ws}</b></td><td>${esc(x.name)}<div class="muted">${esc(x.scope)||''}</div></td><td>${esc(x.lead)||''}</td><td>${esc(x.co_lead)||''}</td><td>${x.joint_decisions?t('yes'):t('no')}</td></tr>`).join('')}</tbody></table></div>
   <h3>${t('govExt')}</h3>${ext.map(x=>`<div class="b"><div style="font-weight:700">${esc(x.lead)}</div><div class="sec">${esc(x.stakeholders)||''}</div>${x.note?`<div class="muted sec">${esc(x.note)}</div>`:''}</div>`).join('')||t('none')}
   <h3>${t('govFuture')}</h3>${spv.map(x=>`<div class="b"><div style="font-weight:700">${esc(x.spv)} <span class="tag Amber">${esc(x.status)}</span></div>${x.note?`<div class="muted sec">${esc(x.note)}</div>`:''}</div>`).join('')||t('none')}
   </div>`); wireShell();
}

async function render(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){loginView();return}
  if(!lists.people) await loadLists();
  if(view==='components')return componentsView();
  if(view==='actions')return actionsView();
  if(view==='matrix')return matrixView();
  if(view==='meeting')return meetingView();
  if(view==='person')return personView();
  if(view==='weekly')return weeklyView();
  if(view==='governance')return governanceView();
  return dashboard();
}
sb.auth.onAuthStateChange(()=>render());
render();
</script>
</body>
</html>
